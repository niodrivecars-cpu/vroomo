name: CI

on:
  push:
    branches: [main, release/1.0]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vroom_ci
          POSTGRES_USER: vroom
          POSTGRES_PASSWORD: vroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vroom -d vroom_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # All base settings have safe defaults, so tests run without a .env file.
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext libmagic1

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Security scan (bandit)
        run: bandit -r fleet config -q -ll

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Check migrations have no drift
        run: python -m manage makemigrations --check --dry-run --settings=config.test_settings

      - name: Compile translation catalogs
        run: python -m manage compilemessages --ignore venv --settings=config.test_settings

      - name: Run tests with coverage
        run: |
          coverage run --source=fleet,config -m manage test fleet --settings=config.test_settings
          coverage report
          coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

      - name: Collect static files
        run: python -m manage collectstatic --noinput --settings=config.test_settings

      - name: Production settings check (check --deploy)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-only-9Zx3vQ7wT2mR8pN5cL6bK1hD4fG0jS7aY3uE8iW
          DEBUG: "False"
          ALLOWED_HOSTS: ci.example.com
          CSRF_TRUSTED_ORIGINS: https://ci.example.com
          DATABASE_URL: postgres://vroom:vroom@localhost:5432/vroom_ci
        run: python -m manage check --deploy

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=vroom-

      - name: Log in to GHCR (push only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

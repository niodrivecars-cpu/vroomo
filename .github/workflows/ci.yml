name: CI

on:
  push:
    branches: [main, release/1.0]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: vroom_ci
          MYSQL_USER: vroom
          MYSQL_PASSWORD: vroom
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # All base settings have safe defaults, so tests run without a .env file.
      PYTHONDONTWRITEBYTECODE: "1"
      # Mirror the production database (MySQL on Hostinger) — CI must run the
      # suite on the same backend the app ships with.
      DATABASE_URL: mysql://vroom:vroom@127.0.0.1:3306/vroom_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext libmagic1

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Security scan (bandit)
        run: bandit -r fleet config -q -ll

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Check migrations have no drift
        run: python -m manage makemigrations --check --dry-run --settings=config.test_settings

      - name: Compile translation catalogs
        run: python -m manage compilemessages --ignore venv --settings=config.test_settings

      - name: Run tests with coverage
        run: |
          coverage run --source=fleet,config -m manage test fleet --settings=config.test_settings
          coverage report
          coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

      - name: Collect static files
        run: python -m manage collectstatic --noinput --settings=config.test_settings

      - name: Production settings check (check --deploy)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-only-9Zx3vQ7wT2mR8pN5cL6bK1hD4fG0jS7aY3uE8iW
          DEBUG: "False"
          ALLOWED_HOSTS: ci.example.com
          CSRF_TRUSTED_ORIGINS: https://ci.example.com
          DATABASE_URL: mysql://vroom:vroom@127.0.0.1:3306/vroom_ci
        run: python -m manage check --deploy

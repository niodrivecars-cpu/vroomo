{% extends 'fleet/base.html' %}
{% load i18n django_bootstrap5 %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="fade-up" style="max-width: 48rem;">
    <h2 class="mb-4">{{ title }}</h2>

    <div class="card">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data" novalidate>
                {% csrf_token %}
                {% bootstrap_form form %}
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary px-4">{% translate "Save" %}</button>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary">{% translate "Cancel" %}</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
